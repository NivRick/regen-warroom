<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>再生醫療戰情室</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 密碼入口 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">⚕</div>
    <h1 class="login-title">REGEN INTEL</h1>
    <p class="login-sub">再生醫療情報系統 v3.0</p>
    <div class="login-form">
      <input type="password" id="pwd-input" placeholder="輸入存取密碼" autocomplete="current-password" />
      <button id="pwd-btn" onclick="checkPassword()">進入系統</button>
    </div>
    <p id="login-error" class="login-error"></p>
    <p class="login-hint">輸入您的存取密碼</p>
  </div>
</div>

<!-- 主介面 -->
<div id="main-app" class="hidden">

  <!-- 頂部導覽 -->
  <header class="top-bar">
    <div class="top-bar-left">
      <span class="logo-icon">⚕</span>
      <span class="logo-text">REGEN INTEL</span>
    </div>
    <div class="top-bar-right">
      <span id="last-update" class="update-time">載入中...</span>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </header>

  <!-- 狀態列 -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot pulse"></span>
      <span>即時監控</span>
    </div>
    <div class="status-item">
      <span id="total-items">--</span> 條情報
    </div>
    <div class="status-item" id="data-date">--</div>
  </div>

  <!-- 股票快訊列 -->
  <div id="stock-ticker" class="stock-ticker hidden"></div>

  <!-- 搜尋列 -->
  <div class="search-bar-wrap">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="search-input"
        placeholder="搜尋關鍵字，例如：CAR-T、外泌體、FDA..."
        autocomplete="off"
        oninput="onSearch(this.value)"
      />
      <button id="search-clear" class="search-clear hidden" onclick="clearSearch()">✕</button>
    </div>
    <div id="search-hint" class="search-hint hidden"></div>
  </div>

  <!-- 控制列：排序 / 摘要模式 / 我的關注 / 統計 / 匯出 -->
  <div class="controls-bar">
    <select id="sort-select" class="ctrl-select" onchange="applyFilters()">
      <option value="date-desc">最新優先</option>
      <option value="date-asc">最舊優先</option>
      <option value="module">依模組</option>
    </select>
    <button id="digest-btn" class="ctrl-btn" onclick="toggleDigest()" title="一頁摘要模式">📋 摘要</button>
    <button id="watch-btn" class="ctrl-btn" onclick="toggleWatchPanel()" title="我的關注">⭐ 關注</button>
    <button id="chart-btn" class="ctrl-btn" onclick="toggleChart()" title="數據統計圖">📊 統計</button>
    <div class="export-group">
      <button class="ctrl-btn export-btn" onclick="exportCSV()" title="匯出 CSV">⬇ CSV</button>
      <button class="ctrl-btn export-btn" onclick="printPage()" title="列印 / 存 PDF">🖨 列印</button>
    </div>
  </div>

  <!-- 統計圖表面板 -->
  <div id="chart-panel" class="chart-panel hidden">
    <div class="chart-title">各模組情報數量</div>
    <canvas id="module-chart" height="200"></canvas>
  </div>

  <!-- 我的關注面板（底部滑出） -->
  <div id="watch-panel" class="watch-panel hidden">
    <div class="watch-panel-header">
      <span>⭐ 我的關注關鍵字</span>
      <button class="watch-close" onclick="toggleWatchPanel()">✕</button>
    </div>
    <div class="watch-input-row">
      <input type="text" id="watch-input" class="watch-input" placeholder="新增關鍵字，例如：CAR-T、訊聯" />
      <button class="watch-add-btn" onclick="addWatchword()">新增</button>
    </div>
    <div id="watch-chips" class="watch-chips"></div>
    <button id="watch-filter-btn" class="watch-filter-btn" onclick="toggleWatchFilter()">套用關注篩選</button>
  </div>

  <!-- 快速篩選 tabs -->
  <nav class="module-tabs">
    <button class="tab-btn active" data-module="all" onclick="filterModule('all', this)">全部</button>
    <button class="tab-btn" data-module="taiwan" onclick="filterModule('taiwan', this)">台灣市場</button>
    <button class="tab-btn" data-module="research" onclick="filterModule('research', this)">臨床突破</button>
    <button class="tab-btn" data-module="apac" onclick="filterModule('apac', this)">亞太合作</button>
    <button class="tab-btn" data-module="regulation" onclick="filterModule('regulation', this)">法規</button>
    <button class="tab-btn" data-module="funding" onclick="filterModule('funding', this)">資金</button>
    <button class="tab-btn" data-module="tourism" onclick="filterModule('tourism', this)">醫療旅遊</button>
    <button class="tab-btn" data-module="competitor" onclick="filterModule('competitor', this)">🎯 競爭動態</button>
  </nav>

  <!-- 情報卡片容器 -->
  <main class="cards-container" id="cards-container">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>載入情報資料...</p>
    </div>
  </main>

  <!-- 底部 -->
  <footer class="footer">
    <p>資料來源：TWSE MOPS · PubMed · FDA · 公開新聞 RSS</p>
    <p>每日自動更新 · 僅供研究參考</p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
